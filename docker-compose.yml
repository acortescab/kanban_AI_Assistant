services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban-ai-assistant-api
    env_file:
      - .env
    volumes:
      - kanban-data:/app/data
    ports:
      - "8000:8000"
    environment:
      KANBAN_DB_PATH: /app/data/kanban.db

volumes:
  kanban-data:

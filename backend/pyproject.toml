[project]
name = "kanban-backend"
version = "0.1.0"
description = "FastAPI backend for the Kanban AI MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# The live tests call the real OpenRouter API, so they are opt-in: uv run pytest -m live
addopts = '-m "not live"'
markers = [
    "live: calls the real OpenRouter API; needs OPENROUTER_API_KEY and an unthrottled provider pool",
]
